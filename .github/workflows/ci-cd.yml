name: CI/CD Pipeline

# CI only: deployment is pull-based. Hosts provisioned by tools/deploy/setup.sh poll for the
# newest push to main whose run of this workflow succeeded (tools/deploy/pull-deploy.sh), so this
# file must keep its name (ci-cd.yml) and no deployment secrets are stored in GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Docs, Frontend & Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goals_test
        ports:
          - 3306:3306
        # `options` are `docker create` flags, not mysqld arguments; MySQL 8.4 already defaults
        # to utf8mb4/utf8mb4_0900_ai_ci and the next step pins the test database explicitly.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pin test database charset and collation
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e "
            ALTER DATABASE goals_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            SELECT VERSION(), DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME
              FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'goals_test';"

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, fileinfo, gd, intl, mbstring, pdo, pdo_mysql, session, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check deploy scripts
        run: |
          mapfile -t scripts < <(find tools/deploy -name '*.sh' | sort)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=warning --external-sources "${scripts[@]}"

      - name: Verify documentation and traceability
        run: |
          php tools/docs/check.php
          php tools/docs/tests/run.php

      - name: Lint, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run test:unit
          npm run build

      - name: Validate and test backend (PHPUnit)
        working-directory: backend
        env:
          APP_ENV: testing
          PLANNER_DB_HOST: 127.0.0.1
          PLANNER_DB_PORT: 3306
          PLANNER_DB_DATABASE: goals_test
          PLANNER_DB_ALLOWED: goals_test
          PLANNER_DB_USERNAME: root
          PLANNER_DB_PASSWORD: root
          PLANNER_DB_CHARSET: utf8mb4
          PLANNER_DB_COLLATION: utf8mb4_0900_ai_ci
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction
          composer check-platform-reqs
          php vendor/bin/phpunit -c phpunit.xml
