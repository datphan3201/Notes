name: Personal AI Planner
on:
  push:
    branches: [feat/personal-ai-planner-v1, main]
    paths: ['apps/**', 'compose.yaml', 'render.yaml', '.github/workflows/planner-v1.yml', 'tools/deploy/planner_v1.py', 'tools/deploy/tests/test_planner_v1.py', 'tools/dev/planner-v1.sh']
  pull_request:
    paths: ['apps/**', 'compose.yaml', 'render.yaml', '.github/workflows/planner-v1.yml', 'tools/deploy/planner_v1.py', 'tools/deploy/tests/test_planner_v1.py', 'tools/dev/planner-v1.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: planner_test
        ports: ['5434:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=2s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify API, worker, authorization and migration
        working-directory: apps/api
        env:
          PLANNER_ENVIRONMENT: testing
          PLANNER_DATABASE_URL: postgresql+psycopg://planner_test:isolated-test-only@127.0.0.1:5434/planner_test
        run: |
          uv sync --frozen --python 3.12
          uv run ruff check planner tests migrations
          uv run alembic upgrade head
          uv run pytest -q
      - name: Verify deployment command plans without publishing
        run: |
          bash -n tools/dev/planner-v1.sh
          python3 -m unittest discover -s tools/deploy/tests -p 'test_planner_v1.py' -q
      - name: Verify Next.js
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run build:e2e
          npx playwright install --with-deps chromium
          npm run test:e2e
