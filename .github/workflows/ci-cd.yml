name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Docs, Frontend & Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goals_test
        ports:
          - 3306:3306
        # `options` are `docker create` flags, not mysqld arguments; MySQL 8.4 already defaults
        # to utf8mb4/utf8mb4_0900_ai_ci and the next step pins the test database explicitly.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pin test database charset and collation
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e "
            ALTER DATABASE goals_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            SELECT VERSION(), DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME
              FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'goals_test';"

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, fileinfo, gd, intl, mbstring, pdo, pdo_mysql, session, sodium, zip
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check deploy scripts
        run: |
          for script in tools/deploy/*.sh; do
            bash -n "$script"
          done
          shellcheck --severity=warning tools/deploy/*.sh

      - name: Verify documentation and traceability
        run: |
          php tools/docs/check.php
          php tools/docs/tests/run.php

      - name: Lint, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run test:unit
          npm run build

      - name: Validate and test backend (PHPUnit)
        working-directory: backend
        env:
          APP_ENV: testing
          PLANNER_DB_HOST: 127.0.0.1
          PLANNER_DB_PORT: 3306
          PLANNER_DB_DATABASE: goals_test
          PLANNER_DB_ALLOWED: goals_test
          PLANNER_DB_USERNAME: root
          PLANNER_DB_PASSWORD: root
          PLANNER_DB_CHARSET: utf8mb4
          PLANNER_DB_COLLATION: utf8mb4_0900_ai_ci
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction
          composer check-platform-reqs
          php vendor/bin/phpunit -c phpunit.xml

      - name: Upload built frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: backend/public/build/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Oracle Cloud
    needs: verify
    # Opt-in: set the repository variable DEPLOY_ENABLED=true. Until then this job is reported as
    # skipped rather than as a successful deployment; once enabled, missing secrets fail the run.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
      ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH }}
      ORACLE_APP_URL: ${{ secrets.ORACLE_APP_URL }}

    steps:
      - name: Check deployment secrets
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY ORACLE_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::DEPLOY_ENABLED is true but these secrets are missing: ${missing[*]}"
            exit 1
          fi

      - name: Download built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: build-artifact

      - name: Configure SSH with the pinned host key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Never trust a key fetched at deploy time: ORACLE_KNOWN_HOSTS is verified once by the owner.
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host planner-host
            HostName ${ORACLE_HOST}
            User ${ORACLE_USER}
            Port ${ORACLE_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config
          ssh planner-host true

      - name: Check out the verified commit on the host
        run: |
          ssh planner-host bash -s -- "${ORACLE_DEPLOY_PATH:-/srv/planner}" "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          echo "Previous revision: $(git rev-parse HEAD)"
          git fetch --quiet origin main
          git reset --hard "$2"
          echo "Deployed revision: $(git rev-parse HEAD)"
          REMOTE

      - name: Sync built frontend assets
        run: |
          rsync -rltz --delete --chmod=D2775,F664 \
            build-artifact/ "planner-host:${ORACLE_DEPLOY_PATH:-/srv/planner}/backend/public/build/"

      - name: Back up, migrate and reload on the host
        run: ssh planner-host "bash '${ORACLE_DEPLOY_PATH:-/srv/planner}/tools/deploy/release.sh'"

      - name: Health check
        run: |
          if [ -z "${ORACLE_APP_URL}" ]; then
            echo "::warning::ORACLE_APP_URL is not set; the /up health check was skipped."
            exit 0
          fi
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${ORACLE_APP_URL%/}/up"

      - name: Explain failed deployment state
        if: failure()
        run: |
          echo "::error::Deployment of ${GITHUB_SHA} failed. The host may already run this revision's code without its migrations or assets."
          echo "Check the step log above, then run tools/deploy/release.sh on the host or roll back to the 'Previous revision' it printed."
          echo "Every release attempt that reached the backup step left a pre-release backup in /var/backups/planner."
